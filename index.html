<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>document.documentElement.dataset.theme=localStorage.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")</script>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>Beyond Border Imports</title>
<meta name="description" content="Imported goods, delivered to you. Browse the latest products.">
<!-- WhatsApp / social preview. Replace YOUR-SITE-URL with your live address -->
<meta property="og:type" content="website">
<meta property="og:title" content="Beyond Border Imports">
<meta property="og:description" content="Imported goods, delivered to you. Browse the latest products.">
<meta property="og:image" content="https://icon.png">
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Beyond Border Imports</h1>
    <div class="tabs"><button id="tShop" class="on">Products</button><button id="tAbout">About</button></div>
  </header>

  <section id="shop">
    <div class="hero">
      <div class="hero-text">
      <span class="kicker">Imported goods</span>
      <h2>Treasures <em>Beyond</em> Borders</h2>
      <p>Quality products from abroad, delivered to you. Browse, pick, and order on WhatsApp.</p>
      <a class="btn" href="#list">Shop now</a>
      </div>
      <div class="collage" id="collage" hidden></div>
    </div>
    <div class="trust"><span>Genuine imports</span><span>Fast delivery</span><span>Order via WhatsApp</span></div>
    <div id="notes" class="notes" hidden></div>
    <div class="filters">
      <input id="q" type="search" placeholder="Search products" aria-label="Search products">
      <div id="cats" class="cats" hidden></div>
    </div>
    <div id="list" class="grid"></div>
    <p id="empty" class="label" hidden>No products yet.</p>
  </section>

  <section id="about" hidden>
    <div class="ig">
      <div id="avBox"></div>
      <div>
        <h2 id="aName"></h2><p class="handle" id="aHandle"></p>
        <div class="stats"><div><b id="aCount">0</b><span class="label">Products</span></div></div>
      </div>
    </div>
    <p class="bio" id="aBio"></p>
    <a class="btn" id="aWa" href="#" hidden>Message on WhatsApp</a>
    <div class="thumbs" id="thumbs"></div>
  </section>
</div>
<div class="dock">
<a id="fWa" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" hidden><svg viewBox="0 0 24 24" width="22" height="22"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>
<a id="fTt" href="#" target="_blank" rel="noopener" aria-label="Follow on TikTok" hidden><svg viewBox="0 0 24 24" width="20" height="20"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6 0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64 0 3.33 2.76 5.7 5.69 5.7 3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48z"/></svg></a>
<button class="theme fab" aria-label="Switch dark or light mode"><svg class="sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
<script>
let liked = []; try { liked = JSON.parse(localStorage.liked || "[]"); } catch (e) {}
const HEART = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5 6.5 5c2 0 3.5 1.1 5.5 3 2-1.9 3.5-3 5.5-3 3.5 0 5.3 3.6 4 6.8C19.5 16.400 12 21 12 21z"/></svg>';

const SHARE_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>';
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); setTimeout(() => e.classList.remove("show"), 2200); }
async function share(x) {                // phone: opens the share sheet (WhatsApp, TikTok, etc.). Otherwise copies the link
  const url = location.origin + location.pathname + "#p-" + x.id;
  const data = { title: x.name, text: x.name + (x.price ? " - " + x.price : "") + " | Beyond Border Imports", url };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(url); toast("Link copied"); }
  } catch (e) {}
}

function show(v) {                       // switch between Products and About
  $("shop").hidden = v !== "shop"; $("about").hidden = v !== "about";
  $("tShop").classList.toggle("on", v === "shop"); $("tAbout").classList.toggle("on", v === "about");
  scrollTo(0, 0);
}
$("tShop").onclick = () => show("shop"); $("tAbout").onclick = () => show("about");

let ALL = [], WA = "", cat = "All";       // all products, her WhatsApp number, chosen category

function card(x) {
  const btn = h("button", { className: "like" + (liked.includes(x.id) ? " on" : "") });
  btn.innerHTML = HEART;
  btn.append(h("span", { textContent: x.likes_text || "0" }));
  btn.onclick = () => {
    const on = btn.classList.toggle("on");
    liked = on ? [...liked, x.id] : liked.filter(i => i !== x.id);
    try { localStorage.liked = JSON.stringify(liked); } catch (e) {}
  };
  const sh = h("button", { className: "share", ariaLabel: "Share " + x.name }); sh.innerHTML = SHARE_ICON; sh.onclick = () => share(x);
  const kids = [h("h3", { textContent: x.name }), h("div", { className: "price", textContent: x.price || "" }),
    h("p", { className: "desc", textContent: x.description || "" })];
  if (x.out_of_stock) kids.push(h("span", { className: "order off", textContent: "Out of stock" }));
  else if (WA) {                          // opens a WhatsApp chat with the message already typed
    const msg = "Hello, I'd like to " + (x.pre_order ? "pre-order " : "order ") + x.name + (x.price ? " (" + x.price + ")" : "") + ".";
    kids.push(h("a", { className: "order", href: "https://wa.me/" + WA + "?text=" + encodeURIComponent(msg), target: "_blank", rel: "noopener", textContent: (x.pre_order ? "Pre-order" : "Order") + " on WhatsApp" }));
  }
  kids.push(h("div", { className: "acts" }, btn, sh));
  const tag = x.out_of_stock ? "Out of stock" : x.pre_order ? "Pre-order" : "";
  const ph = h("div", { className: "ph" + (x.out_of_stock ? " out" : "") }, h("img", { src: x.image_url, alt: x.name, loading: "lazy" }));
  if (tag) ph.append(h("span", { className: "badge", textContent: tag }));
  return h("div", { className: "card", id: "p-" + x.id }, ph, h("div", { className: "b" }, ...kids));
}

function drawProducts() {                 // applies the search box + category filter
  const q = $("q").value.trim().toLowerCase();
  const list = ALL.filter(x => (cat === "All" || x.category === cat) &&
    (!q || (x.name + " " + (x.description || "") + " " + (x.category || "")).toLowerCase().includes(q)));
  $("empty").hidden = list.length > 0;
  $("empty").textContent = ALL.length ? "No products match your search." : "No products yet.";
  $("list").replaceChildren(...list.map(card));
}

function drawCats() {                     // category buttons are built from the categories she typed in admin
  const cs = ["All", ...new Set(ALL.map(x => x.category).filter(Boolean))];
  $("cats").hidden = cs.length < 2;
  $("cats").replaceChildren(...cs.map(c => {
    const b = h("button", { className: "chip" + (c === cat ? " on" : ""), textContent: c });
    b.onclick = () => { cat = c; drawCats(); drawProducts(); };
    return b;
  }));
}
$("q").oninput = drawProducts;

async function load() {
  const [p, n, pr] = await Promise.all([
    sb.from("products").select("*").order("created_at", { ascending: false }),
    sb.from("notices").select("*").order("created_at", { ascending: false }).limit(5),
    sb.from("profile").select("*").eq("id", 1).maybeSingle()
  ]);
  const products = p.data || [], notices = n.data || [], me = pr.data || {};

  // updates: goods arriving + shipping fee
  $("notes").hidden = !notices.length;
  $("notes").replaceChildren(...notices.map(x => h("p", {}, h("b", { textContent: x.kind === "shipping" ? "Shipping fee" : "Goods arriving" }), x.body)));

  // products
  ALL = products; WA = (me.whatsapp || "").replace(/\D/g, "");
  drawCats(); drawProducts();
  const pics = products.filter(x => x.image_url).slice(0, 4);   // hero collage: newest product photos
  $("collage").hidden = pics.length < 2;
  $("collage").dataset.n = pics.length;
  $("collage").replaceChildren(...pics.map(x => h("a", { href: "#p-" + x.id, ariaLabel: x.name }, h("img", { src: x.image_url, alt: x.name }))));

  // about (profile page)
  const name = "Beyond Border Imports";   // fixed brand name
  $("aName").textContent = name;
  $("aHandle").textContent = me.handle || ""; $("aBio").textContent = me.bio || "";
  $("aCount").textContent = products.length;
  $("avBox").replaceChildren(me.avatar_url ? h("img", { className: "av", src: me.avatar_url, alt: name }) : h("div", { className: "av", textContent: name[0] }));
  if (me.whatsapp) { $("fWa").href = "https://wa.me/" + me.whatsapp.replace(/\D/g, "") + "?text=" + encodeURIComponent("Hello, I saw your products on your website."); $("fWa").hidden = false; }
  if (me.tiktok) { $("fTt").href = me.tiktok; $("fTt").hidden = false; }
  if (location.hash.startsWith("#p-")) setTimeout(() => { const el = document.getElementById(location.hash.slice(1)); el && el.scrollIntoView(); }, 100);
  if (me.whatsapp) { $("aWa").href = "https://wa.me/" + me.whatsapp.replace(/\D/g, ""); $("aWa").hidden = false; }
  $("thumbs").replaceChildren(...products.map(x => h("img", { src: x.image_url, alt: x.name, loading: "lazy" })));
}
load();
</script>
</body>
</html>
